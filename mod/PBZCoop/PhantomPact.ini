; Phantom Pact settings. You don't need this file to play online: press F5 in the game and pick Host or Join.
; To change something here: open in Notepad, change, save, then start the game.

; Host  = your world: your partner joins you.
; Guest = you join the host.
; Local = two players on this PC, split screen (in testing). No internet or partner PC needed. F5 > MORE > Mode > LOCAL
;         does the same, then restart the game. F4 > MULTIPLAYER goes back.
; Off   = Phantom Pact stays off (single-player as normal). The F5 panel can start online co-op from here.
Role = Off

; Role = Local only. 2 = one joystick for each player (pad 1 is player 1, pad 2 is player 2).
;                    1 = keyboard and mouse for player 1, the joystick for player 2.
; In the game, F4 opens the panel: screen layout (side by side or top and bottom) and which pad is whose, by dragging.
; Its choices replace this setting. Player 2 on the pad: Cross climbs and jumps, Circle uses things, D-pad down
; drinks the gourd, Options opens the menu; a second Soul appears beside player 1 a few seconds after CONTINUE.
Joysticks = 2

; Role = Local only. 2 = each player on a monitor of their own: while player 2 is in, the game's window covers the monitor
; it's on and the one beside it (or above or below it), player 1 on the left (or top) one. The title, loading screens and
; single player stay on one monitor. Set the game's display mode to Borderless or Windowed first. Monitors of the same
; size, lined up in Windows' display settings, work best. 1 = one screen, split. The F4 panel's third picture does the same.
Monitors = 1

; On: in the game, F5 opens the online panel (any Role but Local): pick Steam, Tailscale or another network, then Host, Guest or Leave,
; with no restart. Joining takes you to the host, on whatever map. Its choices replace Role and Connect here, so the next
; start does the same.
OnlinePanel = On

; English, Chinese or Arabic: the panel and the co-op messages. The panel has the switch.
Language = English

; Play log: On = each time you play, Phantom Pact keeps a text file of what it did and how the game ran, in the logs
; folder beside this file (playlog-<date>-<time>.txt). If something goes wrong, send the one of that session with your
; report (after a restart the newest is the new session's: take the one before it). F7, or both sticks pressed in for a
; second, marks the moment in it. It holds no address, name or password.
; Off = no file. PlayLogKeep: how many of these files are kept (the oldest is deleted as a new one begins).
PlayLog = On
PlayLogKeep = 12

; On: F3 takes you to your partner at any time, on any map. MORE in the panel has the switch. Joining goes to the host either way,
; and so does F3 for a guest whose host has gone on to another map.
; Online, the host's choice counts for everyone (as for PvP and FreeBellTravel); a guest's own comes back when they leave.
PartnerTeleport = Off

; How you connect. Both players must use the same one, and the same Phantom Pact version.
; Steam     = through Steam, no setup: the guest joins a Steam friend who is hosting.
; Tailscale = by IP: both install Tailscale (or another virtual LAN) and the guest puts the host's IP below.
; Trouble connecting? net_status.txt in this folder shows the link: see Connection problems in the install guide.
Connect = Tailscale

; Guest only.
; Tailscale: the host's Tailscale IP (starts with 100.; the host sees it in the Tailscale app).
; Another virtual LAN: the host's address in that app.
; Steam: leave it empty to join any friend who's hosting, or put the host's Steam name to pick one, or their SteamID64
; (17 digits) if they're Invisible in Steam. An IP here is ignored.
HostAddress = PUT-THE-HOSTS-TAILSCALE-IP-HERE

; Steam only. Off = leave it to Steam's own setting (Steam, Settings, In Game, Steam Networking), which on Default means
; Valve's relays: your IP stays hidden, with more delay. On = try for a direct connection, the quickest: your partner's PC
; can then see your IP address, whatever that setting says. Direct needs On on both PCs.
SteamDirect = Off

; By IP only: UDP port. Both players must use the same one. Windows asks the first time the game opens it: click Allow.
Port = 47800

; Host only: Off = accept a partner only from Tailscale, home-network and Hamachi/Radmin addresses (safest).
; On = accept any address: use it with a virtual LAN that gives other addresses (UU Accelerator's multiplayer,
; ZeroTier...). With On, setting a Secret below is recommended.
AllowAnyAddress = Off

; How many players, you included, when you host: 2 = one guest. 4 = up to three guests (Beta). 6 = up to five guests
; (Experimental). Only the host's setting counts: guests follow it. It works from the next Host. MORE in the panel has
; the switch. With more than two players PvP and Revive are off, and F3 goes to the nearest partner who's up.
; (FourPlayers = On, from older versions, still means 4 when this line isn't there.)
PartySize = 2

; 6 players: with this many connected, every enemy and every boss near a player gets a ghost twin: a cyan copy of itself
; with red eyes. Two bosses in each arena, twice the enemies. A boss's twin fades when the boss dies, and the story goes
; on as always. Off = no twins. Only the host's setting counts.
GhostTwins = 5

; Optional password, the same on both PCs: every packet is signed with it, so nobody else on your network can
; join or fake game events. Leave it empty for none. A long phrase is best (e.g. four random words).
; With a Secret, the two PCs' clocks must be within 2 minutes of each other.
Secret =

; Co-op difficulty (Elden Ring style, online): while your partner is with you, enemies and bosses have this much
; health and posture, in percent. 100 = normal. Both players should use the same numbers. (Local co-op keeps the game's
; own numbers and the difficulty you chose: none of the co-op difficulty settings below change it.)
; In a party each person connected adds the same again: 150 is 200 with two connected, 250 with three, and it
; stops there: with five or six players the ghost twins (GhostTwins) make it harder instead.
CoopEnemyHealth = 150
CoopEnemyPosture = 130

; Bosses' own health and posture while your partner is with you, in percent, apart from the enemies'. The posture is the
; guard bar: at 200 a boss has twice its bar with one partner, three times with two and four times with three, so its
; guard should break about as often as when you're alone. CoopBossHealth is left out (take the ; off the front to use
; it): bosses have CoopEnemyHealth like everything else, 150 with one partner, 200 with two, 250 with three. Both players
; should use the same numbers.
;CoopBossHealth = 200
CoopBossPosture = 200

; Boss super armour (online): On = while your partner is with you, a hit doesn't make a boss flinch, knock it back or cut
; its attack short, so it keeps fighting. Breaking its guard still staggers it, and you can still execute it. Off = no
; super armour: bosses flinch at hits as the game has them. Both players should use the same setting.
CoopBossArmor = On

; Partner hit sounds (online): On = your partner's swings sound on your screen as your own do, hit or miss (the
; whoosh, their shout), and their hits on enemies play the game's own hit sound and blood. Off = their swings and hits
; stay silent on your screen, and your game doesn't tell theirs what your hits sound like either. Both players should
; use the same setting.
PartnerHitSounds = On

; Mods check (online): On = when you connect, each game tells the other which other mods it has, as marks only: no file
; and no mod name is sent. If your partner doesn't have a mod of yours, you're told once: what a mod changes (an outfit,
; a weapon's look) shows only on a PC that has that mod, so both of you need to install it. Off = nothing is listed,
; sent or compared.
ModsCheck = On

; How hard enemies and bosses hit you while your partner is with you, in percent. 100 = as the game has them, 150 = half
; as hard again, 50 = half. Each PC sets its own: it's the damage you take.
CoopEnemyDamage = 100
CoopBossDamage = 100

; Boss poise: how hard it is to knock a boss out of an attack while your partner is with you, in percent.
; 100 = normal, 200 = it takes twice the hits to stagger it out of a move. Bosses only. (CoopEnemyPosture above is
; the bar that opens an execution: a bigger bar doesn't stop the interrupts, this does.) With CoopBossArmor On a hit
; doesn't stop a boss's attack anyway: this matters with it Off.
CoopBossPoise = 200

; The game's own difficulty while someone plays with you online: Hellwalker, Pathbreaker, Wayfarer
; or Off. It only goes up: a lower pick is raised while you're together and comes back when you're alone again
; (20 s after your partner leaves). 66 Days stays 66 Days. Each PC uses its own setting.
CoopDifficulty = Hellwalker

; The host's story (online, when you join): On = if your save is behind the host's, your story is brought up to
; theirs while you play together: the quests they've done and the unlocks along the way, bosses included, and the
; chests they've opened open for you with what's in them. It never goes back, and what you found and the bells you
; rang stay yours. Off = your story stays your own.
FollowHostStory = On

; Watching together (online): On = when a scene begins for one of you and the other stands within 30 m with that scene
; still ahead of them, they're set down at its start and both watch it at once (the later one plays a touch faster till
; it has caught up); and a bell one of you rings for the first time is rung for the other too if they're within 30 m of
; it (a bell with a scene of its own is each player's to ring: rung within 30 s of each other, its scenes play
; together). Off = each player's scenes and bells are their own.
WatchTogether = On

; PvPvE (F5 > MORE): On = you and your partner can fight each other out in the world, enemies and all (a kill wins).
; (Its key is still PvP.) The host's choice counts for everyone. PvPDamage scales the damage you take from your partner
; (100 = normal) and PvPParryPosture is the posture an attacker loses when you parry them, both in PvPvE only.
; F6 PvP: a match in a boss arena you've beaten (or where the host stands), with nothing else in it. The host sets it on
; the F6 page; your loadout for it is kept in pvp_preset.txt. Nothing a match changes is saved. A match has its own
; numbers, the same for everyone: every blow at half the game's own, 60 posture for a parry.
PvP = Off
PvPDamage = 100
PvPParryPosture = 60

; Partner on the map: while the map is open, a jade pointer at your partner's position, turned the way
; they face (same area only). On or Off. Online, the host's choice counts for everyone.
PartnerMapIcon = On

; Free bell travel: On = a trip from the map to a bell you've reached costs nothing (a Traversal Talisman is kept in your
; bag and given back after each trip). Off = the game's own rule: each trip costs a talisman. F5 > MORE has the switch.
; Online, the host's choice counts for everyone.
FreeBellTravel = On

; Clear map fog: On = every region's map is uncovered from the start. Off = the game's own rule: the map uncovers as
; you explore. Online, the host's choice counts for everyone. (Fog already cleared in a save stays cleared.)
ClearMapFog = Off

; Revive (coming soon: leave it Off. Both players must match): at 0 health you go down instead of dying, and your partner brings
; you back by striking you. Nightreign's rules. On or Off.
Revive = Off
