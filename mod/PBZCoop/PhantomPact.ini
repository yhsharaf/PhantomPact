; Phantom Pact settings. You don't need this file to play online: press F5 in the game and pick Host or Join.
; To change something here: open in Notepad, change, save, then start the game.

; Host  = your world: your partner joins you.
; Guest = you join the host.
; Local = two players on this PC, split screen (in testing). No internet or partner PC needed. F5 > MORE > Mode > LOCAL
;         does the same, then restart the game. F4 > MULTIPLAYER goes back.
; Off   = Phantom Pact stays off (single-player as normal). The F5 panel can start online co-op from here.
Role = Off

; Role = Local only. 2 = one joystick for each player (pad 1 is player 1, pad 2 is player 2).
;                    1 = keyboard and mouse for player 1, the joystick for player 2.
; In the game, F4 opens the panel: screen layout (side by side or top and bottom) and which pad is whose, by dragging.
; Its choices replace this setting. Player 2 on the pad: Cross climbs and jumps, Circle uses things, D-pad down
; drinks the gourd, Options opens the menu; a second Soul appears beside player 1 a few seconds after CONTINUE.
Joysticks = 2

; On: in the game, F5 opens the online panel (any Role but Local): pick Steam, Tailscale or another network, then Host, Guest or Leave,
; with no restart. Joining takes you to the host, on whatever map. Its choices replace Role and Connect here, so the next
; start does the same.
OnlinePanel = On

; English or Chinese: the panel and the co-op messages. The panel has the switch.
Language = English

; On: F3 takes you to your partner at any time, on any map. MORE in the panel has the switch. Joining goes to the host either way.
PartnerTeleport = Off

; How you connect. Both players must use the same one, and the same Phantom Pact version.
; Steam     = through Steam, no setup: the guest joins a Steam friend who is hosting.
; Tailscale = by IP: both install Tailscale (or another virtual LAN) and the guest puts the host's IP below.
; Trouble connecting? net_status.txt in this folder shows the link: see Connection problems in the install guide.
Connect = Tailscale

; Guest only.
; Tailscale: the host's Tailscale IP (starts with 100.; the host sees it in the Tailscale app).
; Another virtual LAN: the host's address in that app.
; Steam: leave it empty to join any friend who's hosting, or put the host's Steam name to pick one, or their SteamID64
; (17 digits) if they're Invisible in Steam. An IP here is ignored.
HostAddress = PUT-THE-HOSTS-TAILSCALE-IP-HERE

; Steam only. Off = leave it to Steam's own setting (Steam, Settings, In Game, Steam Networking), which on Default means
; Valve's relays: your IP stays hidden, with more delay. On = try for a direct connection, the quickest: your partner's PC
; can then see your IP address, whatever that setting says. Direct needs On on both PCs.
SteamDirect = Off

; By IP only: UDP port. Both players must use the same one. Windows asks the first time the game opens it: click Allow.
Port = 47800

; Host only: Off = accept a partner only from Tailscale, home-network and Hamachi/Radmin addresses (safest).
; On = accept any address: use it with a virtual LAN that gives other addresses (UU Accelerator's multiplayer,
; ZeroTier...). With On, setting a Secret below is recommended.
AllowAnyAddress = Off

; How many players, you included, when you host: 2 = one guest. 4 = up to three guests (Beta). 6 = up to five guests
; (Experimental). Only the host's setting counts: guests follow it. It works from the next Host. MORE in the panel has
; the switch. With more than two players PvP and Revive are off, and F3 goes to the nearest partner who's up.
; (FourPlayers = On, from older versions, still means 4 when this line isn't there.)
PartySize = 2

; 6 players: with this many connected, every enemy and every boss near a player gets a ghost twin: a cyan copy of itself
; with red eyes. Two bosses in each arena, twice the enemies. A boss's twin fades when the boss dies, and the story goes
; on as always. Off = no twins. Only the host's setting counts.
GhostTwins = 5

; Optional password, the same on both PCs: every packet is signed with it, so nobody else on your network can
; join or fake game events. Leave it empty for none. A long phrase is best (e.g. four random words).
; With a Secret, the two PCs' clocks must be within 2 minutes of each other.
Secret =

; Co-op difficulty (Elden Ring style): while your partner is with you, enemies and bosses have this much
; health and posture, in percent. 100 = normal. Both players should use the same numbers.
; In a party each person connected adds the same again: 150 is 200 with two connected, 250 with three, and it
; stops there: with five or six players the ghost twins (GhostTwins) make it harder instead.
CoopEnemyHealth = 150
CoopEnemyPosture = 130

; The host's story (online, when you join): On = if your save is behind the host's, your story is brought up to
; theirs while you play together: the quests they've done and the unlocks along the way, bosses included, and the
; chests they've opened open for you with what's in them. It never goes back, and what you found and the bells you
; rang stay yours. Off = your story stays your own.
FollowHostStory = On

; PvP: On = you and your partner can fight each other (duels: a kill wins the round).
; Both players must set it. PvPDamage scales the damage you take from your partner (100 = normal).
; PvPParryPosture: posture an attacker loses when you parry them (they also stagger).
PvP = Off
PvPDamage = 100
PvPParryPosture = 60

; Partner compass: a line at the top of the screen with your partner's icon on it, showing which way they are
; from where you're looking (red while they're down). On or Off.
PartnerCompass = On

; Partner on the map: while the map is open, a jade pointer at your partner's position, turned the way
; they face (same area only). On or Off.
PartnerMapIcon = On

; Free bell travel: On = a trip from the map to a bell you've reached costs nothing (a Traversal Talisman is kept in your
; bag and given back after each trip). Off = the game's own rule: each trip costs a talisman. F5 > MORE has the switch.
FreeBellTravel = On

; Revive (coming soon: leave it Off. Both players must match): at 0 health you go down instead of dying, and your partner brings
; you back by striking you. Nightreign's rules. On or Off.
Revive = Off
